{% extends "base.html" %}
{% block title %}Iniciar sesión{% endblock %}
{% block content %}
<h1>Iniciar sesión</h1>
<p class="lead">Entra para ver y conectar tus números de WhatsApp.</p>
<form class="card" method="post" action="/login">
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <label for="email">Correo</label>
  <input id="email" name="email" type="email" autocomplete="email" value="{{ email }}" required>
  <label for="password">Contraseña</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required>
  <p style="margin:20px 0 0"><button class="btn" type="submit">Entrar</button></p>
</form>
<p class="muted">¿No tienes cuenta? <a href="/register">Crear una cuenta</a></p>
{% endblock %}
