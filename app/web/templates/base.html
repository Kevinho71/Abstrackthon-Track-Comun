<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Seguimiento de chats{% endblock %}</title>
  <style>
    :root {
      --bg: #f6f7f9; --surface: #fff; --text: #1c2430; --muted: #5b6675; --line: #dfe3e9;
      --accent: #0f766e; --accent-text: #fff; --danger: #b42318; --ok: #0f7a3d; --warn: #9a6700;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #11161c; --surface: #1a212a; --text: #e8ecf1; --muted: #9aa6b4; --line: #2b3541;
        --accent: #2dd4bf; --accent-text: #06201d; --danger: #ff8a80; --ok: #5ddc8a; --warn: #f0c36a;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text);
           font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    header { background: var(--surface); border-bottom: 1px solid var(--line); }
    .bar { max-width: 760px; margin: 0 auto; padding: 12px 16px; display: flex;
           align-items: center; justify-content: space-between; gap: 12px; }
    .brand { font-weight: 650; color: var(--text); text-decoration: none; }
    main { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; }
    h1 { font-size: 1.5rem; margin: 0 0 4px; }
    h2 { font-size: 1.1rem; margin: 28px 0 8px; }
    p.lead { color: var(--muted); margin: 0 0 20px; }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
    label { display: block; font-weight: 600; margin: 14px 0 4px; }
    input[type=text], input[type=email], input[type=password], input[type=tel] {
      width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px;
      background: var(--bg); color: var(--text); font: inherit; }
    input:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .hint { color: var(--muted); font-size: .9rem; margin-top: 4px; }
    .btn { display: inline-block; padding: 10px 16px; border-radius: 8px; border: 1px solid var(--accent);
           background: var(--accent); color: var(--accent-text); font: inherit; font-weight: 600;
           cursor: pointer; text-decoration: none; }
    .btn.secondary { background: transparent; color: var(--text); border-color: var(--line); }
    .btn.danger { background: transparent; color: var(--danger); border-color: var(--line); }
    .link { background: none; border: 0; color: var(--muted); cursor: pointer; font: inherit; padding: 0; text-decoration: underline; }
    .error { color: var(--danger); background: color-mix(in srgb, var(--danger) 10%, transparent);
             border: 1px solid color-mix(in srgb, var(--danger) 35%, transparent);
             padding: 10px 12px; border-radius: 8px; margin: 0 0 12px; }
    .notice { background: color-mix(in srgb, var(--warn) 12%, transparent); border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent);
              padding: 10px 12px; border-radius: 8px; font-size: .95rem; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .list > * + * { border-top: 1px solid var(--line); margin-top: 14px; padding-top: 14px; }
    .badge { font-size: .85rem; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--line); }
    .badge.open { color: var(--ok); border-color: currentColor; }
    .badge.closed { color: var(--muted); }
    .badge.qr, .badge.connecting, .badge.creating { color: var(--warn); border-color: currentColor; }
    .muted { color: var(--muted); }
    .qr { text-align: center; }
    .qr img { width: 240px; max-width: 100%; height: auto; background: #fff; padding: 8px; border-radius: 8px; border: 1px solid var(--line); }
    .code { font: 700 2rem/1.2 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .12em; margin: 8px 0; }
    .grid { display: grid; gap: 20px; }
    @media (min-width: 640px) { .grid.two { grid-template-columns: 1fr 1fr; } }
    ol.steps { padding-left: 20px; margin: 8px 0 0; }
    form.inline { display: inline; }
  </style>
</head>
<body>
  <header>
    <div class="bar">
      <a class="brand" href="/">Seguimiento de chats</a>
      {% if account %}
      <div class="row" style="gap:16px">
        <span class="muted">{{ account.name or account.email }}</span>
        <form method="post" action="/logout" class="inline"><button class="link" type="submit">Salir</button></form>
      </div>
      {% endif %}
    </div>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
